<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - LUMEN S-PRO SERVICES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100">

  <!-- Page de Connexion -->
  <div id="login-page" class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
      <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">LUMEN S-PRO ADMIN</h1>
      <div id="login-error" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>
      <form id="login-form">
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
          <input id="email" type="email" class="w-full p-3 border rounded-lg" placeholder="etslumenspro@gmail.com" required>
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 text-sm font-bold mb-2">Mot de passe</label>
          <input id="password" type="password" class="w-full p-3 border rounded-lg" placeholder="********" required>
        </div>
        <button id="login-btn" type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">
          Se connecter
        </button>
      </form>
    </div>
  </div>

  <!-- Dashboard Admin -->
  <div id="dashboard-page" class="hidden">
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center">
      <h1 class="text-xl font-bold">Dashboard LumenSpro</h1>
      <button id="logout-btn" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">Déconnexion</button>
    </nav>
    
    <div class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow">
          <h3 class="text-gray-500 text-sm">Total Apprenants</h3>
          <p id="total-apprenants" class="text-3xl font-bold">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
          <h3 class="text-gray-500 text-sm">Codes Actifs</h3>
          <p id="total-codes" class="text-3xl font-bold">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
          <h3 class="text-gray-500 text-sm">Revenus Estimés</h3>
          <p id="total-revenus" class="text-3xl font-bold">0 FCFA</p>
        </div>
      </div>

      <div class="bg-white p-6 rounded-lg shadow mb-6">
        <h2 class="text-xl font-bold mb-4">Générer des codes d'accès</h2>
        <div class="flex gap-4 items-end">
          <div>
            <label class="block text-sm font-bold mb-2">Cours</label>
            <select id="cours-select" class="p-2 border rounded">
              <option value="mikrotik-complet">Cours Complet MikroTik</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">Quantité</label>
            <input id="quantite" type="number" value="1" min="1" max="50" class="p-2 border rounded w-24">
          </div>
          <button id="generer-btn" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-700">
            Générer
          </button>
        </div>
        <div id="codes-generes" class="mt-4"></div>
      </div>

      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4">Derniers codes générés</h2>
        <div id="liste-codes" class="space-y-2">
          <p class="text-gray-500">Aucun code pour l'instant</p>
        </div>
      </div>
    </div>
  </div>

<script type="module">
  // 1. IMPORTS FIREBASE + CONFIG
  import { LUMEN_CONFIG } from './config.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, setDoc, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 2. INIT FIREBASE
  const app = initializeApp(LUMEN_CONFIG.firebase);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 3. ELEMENTS DOM
  const loginPage = document.getElementById('login-page');
  const dashboardPage = document.getElementById('dashboard-page');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const genererBtn = document.getElementById('generer-btn');
  const codesGeneresDiv = document.getElementById('codes-generes');
  const listeCodesDiv = document.getElementById('liste-codes');

  // 4. GESTION CONNEXION
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      // Vérifier si c'est un admin
      const adminRef = doc(db, "admins", user.email);
      const adminSnap = await getDoc(adminRef);
      
      if (adminSnap.exists()) {
        loginPage.classList.add('hidden');
        dashboardPage.classList.remove('hidden');
        chargerStats();
        chargerCodes();
      } else {
        afficherErreur("Accès refusé. Vous n'êtes pas admin.");
        await signOut(auth);
      }
    } else {
      loginPage.classList.remove('hidden');
      dashboardPage.classList.add('hidden');
    }
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true;
    loginBtn.textContent = "Connexion...";
    loginError.classList.add('hidden');

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      afficherErreur(getErrorMessage(error.code));
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Se connecter";
    }
  });

  logoutBtn.addEventListener('click', () => signOut(auth));

  // 5. GÉNÉRATION CODES
  genererBtn.addEventListener('click', async () => {
    const cours = document.getElementById('cours-select').value;
    const quantite = parseInt(document.getElementById('quantite').value);
    
    if (quantite < 1 || quantite > 50) {
      alert("Quantité entre 1 et 50");
      return;
    }

    genererBtn.disabled = true;
    genererBtn.textContent = "Génération...";
    codesGeneresDiv.innerHTML = '<div class="loader mx-auto"></div>';

    const codes = [];
    for (let i = 0; i < quantite; i++) {
      const code = 'LUMEN-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      codes.push(code);
      
      await addDoc(collection(db, "codes"), {
        code: code,
        cours: cours,
        utilise: false,
        dateCreation: serverTimestamp(),
        creePar: auth.currentUser.email
      });
    }

    codesGeneresDiv.innerHTML = `
      <div class="bg-green-100 p-4 rounded">
        <p class="font-bold text-green-700 mb-2">${quantite} codes générés :</p>
        <div class="bg-white p-3 rounded font-mono text-sm">
          ${codes.join('<br>')}
        </div>
        <button onclick="navigator.clipboard.writeText('${codes.join('\\n')}')" 
                class="mt-2 bg-blue-500 text-white px-3 py-1 rounded text-sm">
          Copier tout
        </button>
      </div>
    `;
    
    genererBtn.disabled = false;
    genererBtn.textContent = "Générer";
    chargerCodes();
    chargerStats();
  });

  // 6. FONCTIONS UTILITAIRES
  async function chargerStats() {
    const codesSnap = await getDocs(query(collection(db, "codes"), where("utilise", "==", false)));
    document.getElementById('total-codes').textContent = codesSnap.size;
    
    const apprenantsSnap = await getDocs(collection(db, "apprenants"));
    document.getElementById('total-apprenants').textContent = apprenantsSnap.size;
    document.getElementById('total-revenus').textContent = (apprenantsSnap.size * 25000) + ' FCFA';
  }

  async function chargerCodes() {
    const q = query(collection(db, "codes"), where("utilise", "==", false));
    const querySnapshot = await getDocs(q);
    
    if (querySnapshot.empty) {
      listeCodesDiv.innerHTML = '<p class="text-gray-500">Aucun code actif</p>';
      return;
    }

    listeCodesDiv.innerHTML = '';
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      listeCodesDiv.innerHTML += `
        <div class="flex justify-between items-center p-3 bg-gray-50 rounded">
          <span class="font-mono">${data.code}</span>
          <span class="text-sm text-gray-500">${data.cours}</span>
        </div>
      `;
    });
  }

  function afficherErreur(message) {
    loginError.textContent = message;
    loginError.classList.remove('hidden');
  }

  function getErrorMessage(code) {
    switch(code) {
      case 'auth/invalid-email': return 'Email invalide';
      case 'auth/user-not-found': return 'Compte introuvable';
      case 'auth/wrong-password': return 'Mot de passe incorrect';
      case 'auth/invalid-credential': return 'Email ou mot de passe incorrect';
      default: return 'Erreur de connexion. Réessaie.';
    }
  }
</script>

</body>
</html>
